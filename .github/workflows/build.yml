name: build

# This fork's builds, on GitHub's own runners (free for a public repository):
# - tests: the unit tests that need no disc image (Linux and Windows)
# - windows: gt3r-windows-x64.zip (Vulkan, or Direct3D 11 through the bundled ANGLE)
# - web: gt3r-web.zip (docs/BROWSER.md; the page, the game and the small servers built from web/serve.zig)
# On a tag v*-plus.*, job `release` makes a draft release with the two zips and SHA256SUMS (write the notes,
# then publish it) and job `pages` puts the browser build on the gh-pages branch (GitHub Pages).
# No game data is used or produced: the tests that need a disc image are skipped.

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*-plus.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  EMSDK_VERSION: 7.0.0
  ZIG_VERSION: 0.15.2

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libdecor-0-dev libxkbcommon-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libudev-dev libdbus-1-dev zlib1g-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGT3R_BUILD_TOOLS=OFF
      - name: Build the tests
        run: cmake --build build --parallel 4 --target gt3r_tests
      - name: Unit tests (no disc image)
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # ANGLE (OpenGL ES on Direct3D 11): the one in GT3 Revisited v0.6.6's Windows package, checked by hash.
      - name: ANGLE (from GT3 Revisited v0.6.6)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.6 -R matt-pulsipher/GT3-revisited -p gt3r-windows-x64.zip -D angle-src
          python - <<'EOF'
          import hashlib, os, zipfile
          want = {
              "libEGL.dll": "74a8b814f39f998352825940cfce52f39d890ce20350d36aa8de9055067ebd39",
              "libGLESv2.dll": "af2ab03bd4efc2002d9a37db9165365b4f14a11d0d9bb77db1ac4164a34ce28e",
              "LICENSE-ANGLE.txt": "bf4da21bd20bcfb5b60b7ecc67fa864a79be049e21d6178076887f178dd6c71a",
          }
          os.makedirs("angle", exist_ok=True)
          with zipfile.ZipFile("angle-src/gt3r-windows-x64.zip") as z:
              for info in z.infolist():
                  name = info.filename.rsplit("/", 1)[-1]
                  if name in want:
                      data = z.read(info)
                      got = hashlib.sha256(data).hexdigest()
                      if got != want.pop(name):
                          raise SystemExit(f"{name}: unexpected SHA-256 {got}")
                      open(os.path.join("angle", name), "wb").write(data)
          if want:
              raise SystemExit(f"missing from the package: {sorted(want)}")
          EOF
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -A x64 -DGT3R_FETCH_SDL=ON -DGT3R_SDL_SHARED=ON -DGT3R_GLES=ON \
            -DGT3R_BUILD_TESTS=ON -DGT3R_BUILD_TOOLS=ON -DGT3R_ANGLE_DIR="$GITHUB_WORKSPACE/angle"
      - name: Build
        run: cmake --build build --config Release --parallel 4 --target gt3r gt3tool gt3r_tests
      - name: Unit tests (no disc image)
        shell: pwsh
        run: |
          # SDL3.dll is built as a shared library: let the test program find it
          $sdl = Get-ChildItem build -Recurse -Filter SDL3.dll | Select-Object -First 1
          $env:PATH = "$($sdl.DirectoryName);$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist/gt3r-windows-x64
          python packaging/zip.py gt3r-windows-x64.zip dist gt3r-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: gt3r-windows-x64
          path: gt3r-windows-x64.zip
          retention-days: 14
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: emsdk (cached)
        id: emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: emsdk
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          git clone -q https://github.com/emscripten-core/emsdk ~/emsdk
          ~/emsdk/emsdk install "$EMSDK_VERSION"
      - name: zig (for the small servers)
        run: |
          curl -sSfL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" | tar -xJ -C ~
          echo "ZIG=$HOME/zig-x86_64-linux-$ZIG_VERSION/zig" >> "$GITHUB_ENV"
      - name: Build
        run: |
          sudo apt-get install -y ninja-build
          ~/emsdk/emsdk activate "$EMSDK_VERSION" > /dev/null
          . ~/emsdk/emsdk_env.sh > /dev/null
          emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DGT3R_GLES=ON
          cmake --build build-web --target gt3r --parallel 4
      - name: Package
        run: |
          D=dist/web; mkdir -p $D
          cp web/index.html web/start.js web/debug.js web/disc-bridge.js web/disc-worker.js web/coi-sw.js \
             web/data-browser.js web/net-worker.js build-web/gt3r.js build-web/gt3r.wasm $D/
          cp LICENSE $D/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md $D/THIRD-PARTY-NOTICES.txt
          mkdir -p /tmp/zig-out && cd /tmp/zig-out
          for t in x86_64-windows:serve-windows-x64.exe aarch64-macos:serve-macos-arm64 x86_64-macos:serve-macos-x64 \
                   x86_64-linux-musl:serve-linux-x64 aarch64-linux-musl:serve-linux-arm64; do
            "$ZIG" build-exe "$GITHUB_WORKSPACE/web/serve.zig" -O ReleaseSmall -fstrip -target "${t%%:*}" \
              -femit-bin="$GITHUB_WORKSPACE/$D/${t##*:}"
          done
          cd "$GITHUB_WORKSPACE"
          rm -f $D/*.o $D/*.obj $D/*.pdb
          chmod +x $D/serve-*
          python3 packaging/zip.py gt3r-web.zip $D
      - uses: actions/upload-artifact@v4
        with:
          name: gt3r-web
          path: gt3r-web.zip
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum gt3r-windows-x64.zip gt3r-web.zip | tee SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "Built by the build workflow from $GITHUB_SHA. Write the notes, then publish." \
            out/gt3r-windows-x64.zip out/gt3r-web.zip out/SHA256SUMS

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: gt3r-web
          path: /tmp/web
      - name: Update gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/page && cd /tmp/page && unzip -q /tmp/web/gt3r-web.zip && rm -f serve-*
          cd "$GITHUB_WORKSPACE"
          git ls-files | grep -v '^\.nojekyll$' | xargs -r git rm -q --
          cp /tmp/page/* .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then echo "gh-pages unchanged"; exit 0; fi
          git -c user.name=takamorita -c user.email=319565648+takamorita@users.noreply.github.com \
            commit -q -m "The browser build for GitHub Pages, $GITHUB_REF_NAME"
          git push origin HEAD:gh-pages
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true
